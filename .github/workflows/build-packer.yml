name: Build Android Stub Packer

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Cài đặt JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cài đặt Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Tự động khởi tạo toàn bộ cấu trúc dự án & Native C++
        run: |
          mkdir -p app/src/main/java/com/secure/stub
          mkdir -p app/src/main/cpp
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values

          # 1. Tạo CMakeLists.txt để biên dịch NDK C++
          cat << 'EOF' > app/src/main/cpp/CMakeLists.txt
          cmake_minimum_required(VERSION 3.22.1)
          project("secureshield")

          add_library(secureshield SHARED
              native-lib.cpp
          )

          find_library(log-lib log)

          target_link_libraries(secureshield
              ${log-lib}
          )
          EOF

          # 2. Tạo mã nguồn Native C++ (Chống Frida, Anti-Trace/Debugger, quét bộ nhớ)
          cat << 'EOF' > app/src/main/cpp/native-lib.cpp
          #include <jni.h>
          #include <string>
          #include <unistd.h>
          #include <sys/ptrace.h>
          #include <fstream>
          #include <android/log.h>

          #define LOG_TAG "SecureShield"
          #define LOGI(...) __android_log_print(ANDROID_LOG_INFO, LOG_TAG, __VA_ARGS__)

          // 1. Chống Debugger qua Ptrace & TracerPid
          bool checkTracer() {
              if (ptrace(PTRACE_TRACEME, 0, 1, 0) < 0) {
                  return true; // Đang bị tool trace/debug gắn vào
              }
              std::ifstream statusFile("/proc/self/status");
              std::string line;
              while (std::getline(statusFile, line)) {
                  if (line.rfind("TracerPid:", 0) == 0) {
                      int pid = std::stoi(line.substr(10));
                      if (pid != 0) return true;
                  }
              }
              return false;
          }

          // 2. Chống Hooking (Quét Frida, Xposed trong maps RAM)
          bool checkFridaInMemory() {
              std::ifstream mapsFile("/proc/self/maps");
              std::string line;
              while (std::getline(mapsFile, line)) {
                  if (line.find("frida") != std::string::npos ||
                      line.find("xposed") != std::string::npos ||
                      line.find("gadget") != std::string::npos) {
                      return true;
                  }
              }
              return false;
          }

          extern "C" JNIEXPORT jboolean JNICALL
          Java_com_secure_stub_StubApp_verifyEnvironment(JNIEnv *env, jobject thiz) {
              if (checkTracer() || checkFridaInMemory()) {
                  // Phát hiện can thiệp: Trả về false để huỷ chạy
                  return JNI_FALSE;
              }
              return JNI_TRUE;
          }
          EOF

          # 3. Tạo lớp vỏ nạp Java (StubApp)
          cat << 'EOF' > app/src/main/java/com/secure/stub/StubApp.java
          package com.secure.stub;

          import android.app.Application;
          import android.content.Context;
          import android.os.Process;

          public class StubApp extends Application {
              static {
                  System.loadLibrary("secureshield");
              }

              public native boolean verifyEnvironment();

              @Override
              protected void attachBaseContext(Context base) {
                  super.attachBaseContext(base);
                  if (!verifyEnvironment()) {
                      // Phát hiện môi trường dịch ngược/hook -> Tự kết liễu tiến trình
                      Process.killProcess(Process.myPid());
                      System.exit(0);
                  }
                  // Quá trình giải mã Dex trong RAM và nạp dynamic sẽ thực thi tại đây
              }
          }
          EOF

          # 4. Tạo MainActivity rỗng
          cat << 'EOF' > app/src/main/java/com/secure/stub/MainActivity.java
          package com.secure.stub;

          import android.app.Activity;
          import android.os.Bundle;
          import android.widget.TextView;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  TextView tv = new TextView(this);
                  tv.setText("App da duoc bao ve boi Native C++ Shield (Anti-Frida/Dump active).");
                  tv.setTextSize(18);
                  setContentView(tv);
              }
          }
          EOF

          # 5. Tạo AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.secure.stub">

              <application
                  android:name=".StubApp"
                  android:allowBackup="false"
                  android:label="SecureStub"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 6. Tạo file cấu hình Gradle
          cat << 'EOF' > settings.gradle
          rootProject.name = "SecurePacker"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'

          android {
              namespace 'com.secure.stub'
              compileSdk 34

              defaultConfig {
                  applicationId "com.secure.stub"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"

                  externalNativeBuild {
                      cmake {
                          cppFlags "-O3 -fvisibility=hidden"
                      }
                  }
                  ndk {
                      abiFilters 'arm64-v8a', 'armeabi-v7a'
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled true
                      shrinkResources false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
                  }
                  debug {
                      minifyEnabled false
                  }
              }

              externalNativeBuild {
                  cmake {
                      path "src/main/cpp/CMakeLists.txt"
                      version "3.22.1"
                  }
              }
          }
          EOF

      - name: Biên dịch APK với Gradle
        run: |
          gradle wrapper
          ./gradlew assembleDebug

      - name: Đóng gói và lưu file APK về máy
        uses: actions/upload-artifact@v4
        with:
          name: SecureStub-Protected-APK
          path: app/build/outputs/apk/debug/app-debug.apk
